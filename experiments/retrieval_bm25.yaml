# Retrieval sweep: replace dense with BM25-only. Everything else at baseline
# (per-question chunking, bge-small for the index build only — BM25 ignores the
# embedding column at query time, so the embedding choice here is irrelevant for
# scoring). Goal: see how much the FAQ corpus's lexical overlap rewards a sparse
# baseline (architecture §4).

name: retrieval_bm25

corpus:
  path: docs/taxonomy_faqs_cleaned.md

chunking:
  strategy: per_question
  split_long_threshold_tokens: 800
  split_window_tokens: 600
  split_overlap_tokens: 100

embedding:
  backend: bge_small
  batch_size: 32

retrieval:
  method: bm25
  k: 5
  k_pre_rerank: 20
  tau_low: 0.30

reranker:
  model: null
  top_k: 5

prompt:
  path: prompts/system_v1.md

generation:
  model: claude-sonnet-4-6
  max_tokens: 600
  temperature: 0
  prompt_caching: true
