# Chunking variant A: per-question + parent `## Section` heading prepended to chunk text.
# All other axes pinned to baseline (bge-small + dense + no rerank + prompt v1).
# Goal: isolate the effect of the section prior on retrieval (architecture §1).

name: chunking_section

corpus:
  path: docs/taxonomy_faqs_cleaned.md

chunking:
  strategy: per_question_with_section
  split_long_threshold_tokens: 800
  split_window_tokens: 600
  split_overlap_tokens: 100

embedding:
  backend: bge_small
  batch_size: 32

retrieval:
  method: dense
  k: 5
  k_pre_rerank: 20
  tau_low: 0.30

reranker:
  model: null
  top_k: 5

prompt:
  path: prompts/system_v1.md

generation:
  model: claude-sonnet-4-6
  max_tokens: 600
  temperature: 0
  prompt_caching: true
