# Stronger config: bge-large embeddings, per-question + section-header chunking,
# hybrid (dense + BM25 RRF) retrieval, cross-encoder reranking.
# This is the "Max" stack from §9 of docs/01_architecture.md, minus the Voyage swap.

name: bge_large_hybrid_rerank

corpus:
  path: docs/taxonomy_faqs_cleaned.md

chunking:
  strategy: per_question_with_section
  split_long_threshold_tokens: 800
  split_window_tokens: 600
  split_overlap_tokens: 100

embedding:
  backend: bge_large
  batch_size: 16

retrieval:
  method: hybrid
  k: 5
  k_pre_rerank: 20
  tau_low: 0.30

reranker:
  model: BAAI/bge-reranker-v2-m3
  top_k: 5

prompt:
  path: prompts/system_v1.md

generation:
  model: gpt-4o-mini
  max_tokens: 600
  temperature: 0
