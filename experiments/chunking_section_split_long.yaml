# Chunking variant B: section-prepended + sliding-window split for any chunk over the
# 800-token threshold (architecture §1 Variant B). Splits are deduped by parent_id at
# retrieval time. All other axes pinned to baseline.
# Goal: see whether splitting the long-entry outliers (e.g. the 152-line FINREP block)
# helps without hurting the rest of the corpus.

name: chunking_section_split_long

corpus:
  path: docs/taxonomy_faqs_cleaned.md

chunking:
  strategy: per_question_with_section_split_long
  split_long_threshold_tokens: 800
  split_window_tokens: 600
  split_overlap_tokens: 100

embedding:
  backend: bge_small
  batch_size: 32

retrieval:
  method: dense
  k: 5
  k_pre_rerank: 20
  tau_low: 0.30

reranker:
  model: null
  top_k: 5

prompt:
  path: prompts/system_v1.md

generation:
  model: gpt-4o-mini
  max_tokens: 600
  temperature: 0
