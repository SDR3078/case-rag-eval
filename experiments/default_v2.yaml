# Prompt-axis sweep: default retrieval pipeline with prompts/system_v2.md
# (V1 + a one-shot demonstrating refusal on an out-of-scope question).
# `name` differs from `default` so summary.json keeps both rows.

name: default_v2

corpus:
  path: docs/taxonomy_faqs_cleaned.md

chunking:
  strategy: per_question
  split_long_threshold_tokens: 800
  split_window_tokens: 600
  split_overlap_tokens: 100

embedding:
  backend: bge_small
  batch_size: 32

retrieval:
  method: dense
  k: 5
  k_pre_rerank: 20
  tau_low: 0.30

reranker:
  model: null
  top_k: 5

prompt:
  path: prompts/system_v2.md

generation:
  model: gpt-4o-mini
  max_tokens: 600
  temperature: 0
